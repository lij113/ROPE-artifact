[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-mcp-runtime"
version = "0.0.1"
description = "Residual obligation effect runtime skeleton for intent-preserving MCP agents."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["rope_core", "rope_proxy", "rope_bench", "rope_attacklab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

